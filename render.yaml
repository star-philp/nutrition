databases:
  - name: nutrition-db
    databaseName: baby_food_db
    user: baby_food_user
    plan: free # Managed Postgres free tier

services:

  # Backend Web Service (FastAPI)
  - type: web
    name: nutrition-backend
    env: python
    plan: free # explicitly set to free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://nutrition-frontend.onrender.com

  # Frontend Static Site (Vite/React)
  - type: web
    name: nutrition-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nutrition-backend.onrender.com
